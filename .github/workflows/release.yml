name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish single-file exe
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0-dev' }
          dotnet publish src/Consolize.SessionManager -c Release -r win-x64 -o out/publish -p:Version=$version
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed with $LASTEXITCODE" }
          $hash = (Get-FileHash out/publish/consolize.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  consolize.exe" | Set-Content out/publish/consolize.exe.sha256 -Encoding ASCII

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: consolize-win-x64
          path: |
            out/publish/consolize.exe
            out/publish/consolize.exe.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/publish/consolize.exe
            out/publish/consolize.exe.sha256
          generate_release_notes: true
