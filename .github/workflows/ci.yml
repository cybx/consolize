name: ci

# The checks in this repository have caught real bugs, and every one of them was
# caught because someone remembered to run them. This is that, without the
# remembering. Windows, because the scripts are Windows scripts: the VDF tests
# draw with System.Drawing and use fonts that ship with Windows.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Windows runners queue for about ten minutes here, so two runs for the same
# commit means the second one waits behind the first to say the same thing.
# Superseded runs are cancelled instead: what matters is the answer for the tip
# of the branch, not the answer for every commit that got pushed on the way.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Static checks over every PowerShell script
        shell: pwsh
        run: ./scripts/check-scripts.ps1

      - name: Steam shortcuts.vdf round trip
        shell: pwsh
        run: ./scripts/test-shortcuts-vdf.ps1

      # A clean Windows install has Windows PowerShell 5.1, not pwsh 7. The two
      # engines differ in JSON array enumeration, native stderr and a few parser
      # rules, so the installer must pass in the engine that actually runs it.
      - name: Static checks in Windows PowerShell 5.1
        shell: powershell
        run: ./scripts/check-scripts.ps1

      - name: Steam shortcuts round trip in Windows PowerShell 5.1
        shell: powershell
        run: ./scripts/test-shortcuts-vdf.ps1

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.100'

      # The release workflow publishes this same project. Building it here means
      # a change that does not compile is caught on the commit rather than on
      # the tag, when the only way out is another tag.
      - name: Build the session manager
        run: dotnet publish src/Consolize.SessionManager -c Release -r win-x64 -o out/ci

      - name: Smoke-test binary metadata and CLI
        shell: pwsh
        run: |
          $exe = (Resolve-Path out/ci/consolize.exe).Path
          $start = [Diagnostics.ProcessStartInfo]::new($exe, '--version')
          $start.UseShellExecute = $false
          $start.RedirectStandardOutput = $true
          $process = [Diagnostics.Process]::Start($start)
          $process.WaitForExit()
          $output = $process.StandardOutput.ReadToEnd().Trim()
          if ($process.ExitCode -ne 0 -or $output -notmatch '^consolize \d+\.\d+\.\d+') {
            throw "unexpected version result: exit=$($process.ExitCode), output='$output'"
          }
